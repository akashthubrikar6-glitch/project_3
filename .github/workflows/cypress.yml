name: Cypress Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"

jobs:
  cypress-smoke:
    name: Run Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        run: npm install

      - name: Run Smoke Tests
        run: npx cypress run --env TAGS="@smoke"

      - name: Generate Cucumber HTML Report - Smoke
        if: always()
        run: |
          node -e "
          const reporter = require('cucumber-html-reporter');
          const options = {
            theme: 'bootstrap',
            jsonFile: 'cypress/reports/cucumber-json/output.json',
            output: 'cypress/reports/smoke-report.html',
            reportSuiteAsScenarios: true,
            launchReport: false,
            metadata: { 'Test Environment': 'GitHub Actions', 'Report Type': 'Smoke Tests' }
          };
          reporter.generate(options);
          "

      - name: Generate Allure Report - Smoke
        if: always()
        run: |
          npx allure generate allure-results --clean -o allure-report-smoke || true

      - name: Upload Smoke Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-reports
          path: |
            cypress/reports/smoke-report.html
            allure-report-smoke

      - name: Send Email - Smoke Tests Complete
        uses: dawidd6/action-send-mail@v3
        if: always()
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🧪 Smoke Tests Complete - ${{ job.status }}"
          to: ${{ secrets.TEAM_EMAILS }}
          from: "Cypress CI Automation"
          body: |
            ✅ Smoke Tests Execution Report
            
            Status: ${{ job.status }}
            Run ID: ${{ github.run_id }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            
            📊 Reports Generated:
            1. Cucumber HTML Report
            2. Allure Professional Dashboard
            
            Both reports available in Artifacts!

  cypress-regression:
    name: Run Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        run: npm install

      - name: Run Regression Tests
        run: npx cypress run --env TAGS="@regression"

      - name: Generate Cucumber HTML Report - Regression
        if: always()
        run: |
          node -e "
          const reporter = require('cucumber-html-reporter');
          const options = {
            theme: 'bootstrap',
            jsonFile: 'cypress/reports/cucumber-json/output.json',
            output: 'cypress/reports/regression-report.html',
            reportSuiteAsScenarios: true,
            launchReport: false,
            metadata: { 'Test Environment': 'GitHub Actions', 'Report Type': 'Regression Tests' }
          };
          reporter.generate(options);
          "

      - name: Generate Allure Report - Regression
        if: always()
        run: |
          npx allure generate allure-results --clean -o allure-report-regression || true

      - name: Upload Regression Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-test-reports
          path: |
            cypress/reports/regression-report.html
            allure-report-regression

      - name: Send Email - Regression Tests Complete
        uses: dawidd6/action-send-mail@v3
        if: always()
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🧪 Regression Tests Complete - ${{ job.status }}"
          to: ${{ secrets.TEAM_EMAILS }}
          from: "Cypress CI Automation"
          body: |
            ✅ Regression Tests Execution Report
            
            Status: ${{ job.status }}
            Run ID: ${{ github.run_id }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            
            📊 Reports Generated:
            1. Cucumber HTML Report
            2. Allure Professional Dashboard
            
            Both reports available in Artifacts!


name: Cypress Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"

jobs:
  cypress-smoke:
    name: Run Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        run: npm install

      - name: Run Smoke Tests
        run: npx cypress run --env TAGS="@smoke"

      - name: Generate Cucumber HTML Report - Smoke
        if: always()
        run: |
          mkdir -p cypress/reports/cucumber-json
          if [ -f "cypress/reports/cucumber-json/output.json" ]; then
            node -e "
            const reporter = require('cucumber-html-reporter');
            const options = {
              theme: 'bootstrap',
              jsonFile: 'cypress/reports/cucumber-json/output.json',
              output: 'cypress/reports/smoke-report.html',
              reportSuiteAsScenarios: true,
              launchReport: false,
              metadata: { 'Test Environment': 'GitHub Actions', 'Report Type': 'Smoke Tests' }
            };
            reporter.generate(options);
            "
          else
            echo "Cucumber JSON not found, creating simple report..."
            echo "<html><body><h1>Smoke Tests Report</h1><p>Report will be generated after tests run</p></body></html>" > cypress/reports/smoke-report.html
          fi

      - name: Generate Allure Report - Smoke
        if: always()
        run: |
          npx allure generate allure-results --clean -o allure-report-smoke || true

      - name: Upload Smoke Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-reports
          path: |
            cypress/reports/smoke-report.html
            allure-report-smoke

  cypress-regression:
    name: Run Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        run: npm install

      - name: Run Regression Tests
        run: npx cypress run --env TAGS="@regression"

      - name: Generate Cucumber HTML Report - Regression
        if: always()
        run: |
          mkdir -p cypress/reports/cucumber-json
          if [ -f "cypress/reports/cucumber-json/output.json" ]; then
            node -e "
            const reporter = require('cucumber-html-reporter');
            const options = {
              theme: 'bootstrap',
              jsonFile: 'cypress/reports/cucumber-json/output.json',
              output: 'cypress/reports/regression-report.html',
              reportSuiteAsScenarios: true,
              launchReport: false,
              metadata: { 'Test Environment': 'GitHub Actions', 'Report Type': 'Regression Tests' }
            };
            reporter.generate(options);
            "
          else
            echo "Cucumber JSON not found, creating simple report..."
            echo "<html><body><h1>Regression Tests Report</h1><p>Report will be generated after tests run</p></body></html>" > cypress/reports/regression-report.html
          fi

      - name: Generate Allure Report - Regression
        if: always()
        run: |
          npx allure generate allure-results --clean -o allure-report-regression || true

      - name: Upload Regression Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-test-reports
          path: |
            cypress/reports/regression-report.html
            allure-report-regression


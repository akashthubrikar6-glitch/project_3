name: 📈 Monthly Regression Report

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'

jobs:
  regression-report:
    name: Build monthly regression dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression suite
        id: regression
        continue-on-error: true
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          start_seconds=$(date +%s)
          result=0
          npx cypress run --headless --env TAGS=@regression || result=$?
          end_seconds=$(date +%s)
          echo "duration_seconds=$((end_seconds - start_seconds))" >> "$GITHUB_OUTPUT"
          exit "$result"

      - name: Generate regression run details
        if: always()
        env:
          REGRESSION_DURATION_SECONDS: ${{ steps.regression.outputs.duration_seconds }}
          REGRESSION_STARTED_AT: ${{ steps.regression.outputs.started_at }}
        run: node scripts/createRegressionRunReport.js

      - name: Restore previous regression history
        if: always()
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: monthly-regression-report.yml
          branch: main
          name: regression-history
          path: ./history
          if_no_artifact_found: warn

      - name: Save run history
        if: always()
        run: |
          node scripts/regressionHistory.js
          node scripts/regressionHistory.js --summary
          node scripts/generateMonthlyDashboard.js

      - name: Show summary files
        if: always()
        run: |
          echo "Generated files:"
          ls -R history

      - name: Upload regression history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-history
          path: ./history/regression-history.json
          retention-days: 365

      - name: Upload monthly report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-regression-report
          path: ./history
          retention-days: 90

      - name: Upload detailed regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-run-details-${{ github.run_number }}
          path: |
            cypress/reports/regression-report.html
            cypress/reports/cucumber-json/output.json
          retention-days: 90

      - name: Add job summary
        if: always()
        run: |
          echo "### Run links" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow run: $GITHUB_RUN_NUMBER" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: $GITHUB_REF_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- Monthly dashboard: history/monthly-dashboard.html" >> $GITHUB_STEP_SUMMARY
          echo "- Monthly summary: history/monthly-summary.json" >> $GITHUB_STEP_SUMMARY
          echo "- Download the \`regression-run-details-$GITHUB_RUN_NUMBER\` artifact for the full HTML and JSON reports." >> $GITHUB_STEP_SUMMARY

      - name: Send monthly regression report email
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        if: ${{ always() && env.SMTP_SERVER != '' && env.SMTP_PORT != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.SMTP_FROM != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: Monthly Regression Report - Run ${{ github.run_number }}
          to: akashthubrikar6@gmail.com
          from: GitHub Actions <${{ env.SMTP_FROM }}>
          content_type: text/html
          body: |
            <h2>Monthly Regression Report</h2>
            <p>Workflow run: <strong>${{ github.run_number }}</strong></p>
            <p>Branch: <strong>${{ github.ref_name }}</strong></p>
            <p>Repository: <strong>${{ github.repository }}</strong></p>
            <p>Artifact is attached with the generated dashboard and summary for this month.</p>
            <p>GitHub Actions run: <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">Open run</a></p>
          attachments: |
            history/monthly-dashboard.html,
            history/monthly-summary.json

      - name: Fail job if regression tests failed
        if: steps.regression.outcome == 'failure'
        run: exit 1
